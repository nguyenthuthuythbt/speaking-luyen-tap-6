<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speaking Quest – Luyện nói 6 thẻ</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(30,41,59,.92);--amber:#fbbf24;--ink:#f8fafc;--mute:#aab6ca}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Nunito,sans-serif;color:var(--ink);background:linear-gradient(135deg,#0f172a,#1e1b4b,#0f172a);padding:28px 16px 40px;text-align:center}
h1{font-family:Fredoka,sans-serif;font-size:clamp(1.8rem,5vw,2.8rem);margin:0 0 6px;background:linear-gradient(90deg,#fcd34d,#fdba74,#fef08a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-weight:900;font-size:clamp(1rem,2.6vw,1.25rem);margin:0 0 18px}
h2{font-family:Fredoka,sans-serif;color:var(--amber);font-size:1.3rem;margin:26px auto 12px;max-width:640px;text-align:left}
.grid{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(10px,2vw,18px)}
a.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;padding:14px 10px;border-radius:22px;text-decoration:none;color:var(--ink);background:var(--panel);border:3px solid rgba(251,191,36,.45);box-shadow:0 8px 22px rgba(0,0,0,.4);transition:transform .2s,border-color .2s}
a.card:hover{transform:translateY(-6px);border-color:var(--amber)}
a.card:focus-visible{outline:4px solid var(--amber);outline-offset:3px}
.num{font-family:Fredoka,sans-serif;font-weight:700;font-size:2.4rem;line-height:1;color:var(--amber)}
.em{font-size:1.8rem}
.t{font-weight:900;font-size:clamp(.95rem,2.4vw,1.15rem);line-height:1.25}
.hint{margin:26px auto 0;max-width:640px;color:var(--mute);font-weight:700;font-size:1.05rem;line-height:1.5}
footer{margin-top:28px;color:var(--mute);font-family:Fredoka,sans-serif}
footer b{color:var(--amber)}
@media (max-width:640px){.grid{grid-template-columns:repeat(1,1fr)}}
</style>
</head>
<body>
<h1>🎤 Speaking Quest · Luyện nói</h1>
<p class="sub">English 7 · Chọn một thẻ, nói xong em sẽ biết điểm ngay</p>
<div id="groups"></div>
<p class="hint">Em có thể luyện nhiều lần. Đọc phần <b>Cần cải thiện</b> rồi bấm Try again để điểm cao hơn nhé! 💪</p>
<footer id="foot"></footer>
<script>
(function(){
  var AUTHOR = 'Teacher Thuy';
  var G = [
    ['🌱 Hobbies – Sở thích', [[1,'🌱','Hobbies'],[4,'🧩','A Hobby I Do in My Free Time']]],
    ['🍎 Healthy living – Sống khoẻ', [[2,'🍎','Healthy Living'],[5,'🥗','My Healthy Habits']]],
    ['🤝 Community service – Cộng đồng', [[3,'🤝','Community Service'],[6,'💡','Ideas for Community Projects']]]
  ];
  var root = document.getElementById('groups');
  G.forEach(function(g){
    var h = document.createElement('h2'); h.textContent = g[0]; root.appendChild(h);
    var grid = document.createElement('div'); grid.className = 'grid';
    g[1].forEach(function(c){
      var a = document.createElement('a'); a.className = 'card'; a.href = 'g7-card' + c[0] + '/index.html';
      a.innerHTML = '<span class="num">' + c[0] + '</span><span class="em">' + c[1] + '</span><span class="t">' + c[2] + '</span>';
      grid.appendChild(a);
    });
    root.appendChild(grid);
  });
  if (AUTHOR && AUTHOR.indexOf('__AUTHOR__') < 0) document.getElementById('foot').innerHTML = '© ' + new Date().getFullYear() + ' <b>' + AUTHOR.replace(/[<>&]/g, '') + '</b> · Speaking Quest';
})();
</script>
</body>
</html>
